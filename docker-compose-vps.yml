services:
  postgresql-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_vps_data:/var/lib/postgresql/data
      - ./scripts/init-postgres-dbs.sql:/docker-entrypoint-initdb.d/init-postgres-dbs.sql:ro
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  rabbitmq:
    image: rabbitmq:3.11-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    ports: []
    networks:
      - project5-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    mem_limit: 256m

  identity-service:
    image: ghcr.io/bebongcute19-gif/project5-identity-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8081
      DB_HOST: postgresql-db
      DB_PORT: 5432
      DB_NAME: identity_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgresql-db:
        condition: service_healthy
    networks:
      - project5-network
    mem_limit: 384m

  product-service:
    image: ghcr.io/bebongcute19-gif/project5-product-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8082
      DB_HOST: postgresql-db
      DB_PORT: 5432
      DB_NAME: product_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "127.0.0.1:8082:8082"
    depends_on:
      postgresql-db:
        condition: service_healthy
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082/api/v1/products/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  order-service:
    image: ghcr.io/bebongcute19-gif/project5-order-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8083
      DB_HOST: postgresql-db
      DB_PORT: 5432
      DB_NAME: order_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "127.0.0.1:8083:8083"
    depends_on:
      postgresql-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 512m

  payment-service:
    image: ghcr.io/bebongcute19-gif/project5-payment-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8084
      DB_HOST: postgresql-db
      DB_PORT: 5432
      DB_NAME: payment_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx256m"
    ports:
      - "127.0.0.1:8084:8084"
    depends_on:
      postgresql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8084/api/v1/payments/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 384m

  notification-service:
    image: ghcr.io/bebongcute19-gif/project5-notification-service:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8085
      DB_HOST: postgresql-db
      DB_PORT: 5432
      DB_NAME: notification_db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx192m"
    ports:
      - "127.0.0.1:8085:8085"
    depends_on:
      postgresql-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8085/api/v1/notifications/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    mem_limit: 256m

  api-gateway:
    image: ghcr.io/bebongcute19-gif/project5-api-gateway:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8080
      IDENTITY_SERVICE_HOST: identity-service
      IDENTITY_SERVICE_PORT: 8081
      PRODUCT_SERVICE_HOST: product-service
      PRODUCT_SERVICE_PORT: 8082
      ORDER_SERVICE_HOST: order-service
      ORDER_SERVICE_PORT: 8083
      PAYMENT_SERVICE_HOST: payment-service
      PAYMENT_SERVICE_PORT: 8084
      NOTIFICATION_SERVICE_HOST: notification-service
      NOTIFICATION_SERVICE_PORT: 8085
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx384m"
    ports:
      - "0.0.0.0:80:8080"
    depends_on:
      identity-service:
        condition: service_healthy
      product-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      payment-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - project5-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
    mem_limit: 512m

networks:
  project5-network:
    driver: bridge

volumes:
  postgres_vps_data: