server:
  port: ${PORT:8082}

spring:
  application:
    name: product-service
  data:
    mongodb:
      uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:rootpassword}@${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:product_db}?authSource=admin
    elasticsearch:
      repositories:
        enabled: true

elasticsearch:
  uris: ${ELASTICSEARCH_URIS:http://localhost:9200}

grpc:
  server:
    port: ${GRPC_PORT:9082}

jwt:
  secret: ${JWT_SECRET:YWJjZGVmZ2hpamtsbW5vcHFyc3R1dnd4eXoxMjM0NTY3ODkwYWJjZGVmZ2hpamtsbW5vcA==}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
