
name: Project5 CD

on:
  workflow_run:
    workflows: ["Project5 Docker Publish"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: project5-vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout published commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Test rollback logic
        run: bash scripts/tests/test-rollback.sh

      - name: Prepare deployment files
        run: |
          mkdir -p deploy-package/scripts
          cp docker-compose-vps.yml deploy-package/
          cp scripts/init-postgres-dbs.sql deploy-package/scripts/
          cp scripts/deploy-identity.sh deploy-package/scripts/
          cp scripts/deploy-all.sh deploy-package/scripts/

      - name: Copy deployment files to VPS
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "deploy-package/docker-compose-vps.yml,deploy-package/scripts/init-postgres-dbs.sql,deploy-package/scripts/deploy-identity.sh,deploy-package/scripts/deploy-all.sh"
          target: "/opt/project5"
          strip_components: 1
          overwrite: true

      - name: Deploy Identity Service with Rollback
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/project5
            bash scripts/deploy-identity.sh

      - name: Deploy remaining services
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            set -e
            cd /opt/project5
            bash scripts/deploy-all.sh
